[package]
name = "zeroclaw-memory"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Memory backends, embeddings, consolidation, and retrieval for ZeroClaw."
publish = false

[dependencies]
zeroclaw-log.workspace = true
zeroclaw-api.workspace = true
zeroclaw-providers.workspace = true
zeroclaw-spawn.workspace = true
zeroclaw-config = { workspace = true, default-features = false }
anyhow = "1.0"
async-trait = "0.1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
parking_lot = "0.12"
regex = "1.10"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-webpki-roots-no-provider", "__rustls-ring"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1.0", default-features = false, features = ["derive"] }
serde_json = { version = "1.0", default-features = false, features = ["std"] }
sha2 = "0.10"
tokio = { version = "1.50", default-features = false, features = ["fs", "io-util", "macros", "process", "sync", "time"] }
uuid = { version = "1.22", default-features = false, features = ["v4", "std"] }
postgres = { version = "0.19", features = ["with-chrono-0_4"], optional = true }
# Cerveau: real vector storage/recall for the Postgres memory backend
# (crates/zeroclaw-memory/src/postgres.rs) — ToSql/FromSql for the sync
# `postgres` crate's Client, binding pgvector's `vector` column type.
pgvector = { version = "0.4", features = ["postgres"], optional = true }
# Cerveau: real connection pooling for PostgresMemory. Replaces a single
# Arc<Mutex<Client>> (every tenant serialized on one physical connection)
# with a bounded pool of connections, checked out per operation. r2d2 is
# thread-based (no tokio integration needed) — matches this crate's
# existing pattern of running every blocking Postgres call on a dedicated
# OS thread via `run_on_os_thread`, never on the async runtime.
r2d2 = { version = "0.8", optional = true }
r2d2_postgres = { version = "0.18", optional = true }
# Agent Task Ledger: gzip-compress archived (done) tasks before storing them
# as bytea — see task_ledger.rs's archive-on-done path.
flate2 = "1"

[features]
memory-postgres = ["dep:postgres", "dep:pgvector", "dep:r2d2", "dep:r2d2_postgres", "zeroclaw-config/memory-postgres"]

[dev-dependencies]
filetime = "0.2"
tempfile = "3.26"
tokio = { version = "1.50", features = ["rt-multi-thread", "macros"] }
toml = "1.0"
