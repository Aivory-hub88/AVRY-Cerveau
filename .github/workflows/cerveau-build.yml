name: cerveau-build

# Aivory Cerveau patch 0001: the one workflow this fork needs.
# Builds the `zeroclaw` binary for x86_64-unknown-linux-gnu with the same
# recipe as upstream's v0.8.3 release job (see CERVEAU_PATCHES.md).

on:
  push:
    branches: [cerveau-main]
    paths-ignore:
      - "docs/**"
      - "*.md"
      - "docs/*.md"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  # ── Fast gate (no DB) — also covered by cerveau-quick on PRs, but kept
  # here so the release gate is self-contained and its artifact is green
  # only when isolation actually passes.
  tenant-isolation:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.1
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: cerveau-tenant-isolation
      - name: Tenant identity & isolation tests
        run: |
          cargo test --locked -p zeroclaw-memory --test tenant_isolation
          cargo test --locked -p zeroclaw-runtime tenant
          cargo test --locked -p zeroclaw-gateway tenant::

  # ── Postgres-dependent tests (ADR-004, capability graph)
  postgres-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: cerveau
          POSTGRES_PASSWORD: cerveau
          POSTGRES_DB: cerveau_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cerveau"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CERVEAU_TEST_PG_URL: "host=127.0.0.1 port=5432 user=cerveau password=cerveau dbname=cerveau_test"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.1
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: cerveau-postgres-tests
      - name: Memory lifecycle (Postgres) tests
        run: |
          cargo test --locked -p zeroclaw-memory --features memory-postgres --test pg_lifecycle
          cargo test --locked -p zeroclaw-runtime control_plane::tool_idem
      - name: Postgres memory embedding + hybrid recall tests
        run: |
          cargo test --locked -p zeroclaw-memory --features memory-postgres --test pg_embedding_recall
      - name: Capability graph (Postgres) tests
        env:
          RUST_BACKTRACE: full
        run: |
          cargo test --locked -p zeroclaw-memory --features memory-postgres --test pg_capability_graph -- --test-threads=1
          cargo test --locked -p zeroclaw-memory --features memory-postgres capability_graph::

  # ── Redis-dependent tests (ADR-005)
  redis-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CERVEAU_TEST_REDIS_URL: "redis://127.0.0.1:6379"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.1
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: cerveau-redis-tests
      - name: Webhook rate-limit dimension tests
        run: |
          cargo test --locked -p zeroclaw-gateway --lib per_ip_limit
          cargo test --locked -p zeroclaw-gateway --lib gateway_rate_limiter_tenant_limits_are_isolated_per_tenant
      - name: Shared rate limiter + admission queue tests (ADR-005)
        run: |
          cargo test --locked -p zeroclaw-gateway --lib redis_rate_limiter::
          cargo test --locked -p zeroclaw-gateway --lib gateway_rate_limiter_upgrade_to_redis
          cargo test --locked -p zeroclaw-gateway --lib admission_queue::
          cargo test --locked -p zeroclaw-gateway --lib webhook_returns_503_when_admission_queue_is_saturated

  # ── Release build — only after all gates are green
  build-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    needs: [tenant-isolation, postgres-tests, redis-tests]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.1
          targets: x86_64-unknown-linux-gnu

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: cerveau-x86_64-unknown-linux-gnu

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build web dashboard
        run: cargo web build

      - name: Build release binary
        run: |
          FEATURES="$(cargo run --quiet -p xtask --bin generate -- features --selection dist --target x86_64-unknown-linux-gnu)"
          FEATURES="$FEATURES,memory-postgres"
          FEATURES="$FEATURES,sandbox-landlock"
          echo "Resolved features: $FEATURES"
          cargo build --release --locked --no-default-features \
            --features "$FEATURES" \
            --target x86_64-unknown-linux-gnu

      - name: Package
        run: |
          tar -czf zeroclaw-x86_64-unknown-linux-gnu.tar.gz \
            -C target/x86_64-unknown-linux-gnu/release zeroclaw
          sha256sum zeroclaw-x86_64-unknown-linux-gnu.tar.gz \
            > zeroclaw-x86_64-unknown-linux-gnu.tar.gz.sha256
          ls -la zeroclaw-x86_64-unknown-linux-gnu.tar.gz*

      - uses: actions/upload-artifact@v4
        with:
          name: zeroclaw-x86_64-unknown-linux-gnu
          path: |
            zeroclaw-x86_64-unknown-linux-gnu.tar.gz
            zeroclaw-x86_64-unknown-linux-gnu.tar.gz.sha256
          retention-days: 30

      - name: Publish rolling release (public, token-free download for VPS deploy)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="cerveau-cd"
          gh release delete "$TAG" --yes --cleanup-tag --repo "${{ github.repository }}" || true
          gh release create "$TAG" \
            --repo "${{ github.repository }}" \
            --title "Cerveau CD artifact ($(git rev-parse --short HEAD))" \
            --notes "Rolling deploy artifact, auto-published from commit ${{ github.sha }}. Not a versioned release — always points at the latest cerveau-main build." \
            zeroclaw-x86_64-unknown-linux-gnu.tar.gz \
            zeroclaw-x86_64-unknown-linux-gnu.tar.gz.sha256
